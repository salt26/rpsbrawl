map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 앞단 nginx가 정하지 않은 Host로 온 요청은 받지 않는다.
server {
    listen 80 default_server;
    return 404;
}

# 웹 클라이언트 (React 빌드)
server {
    listen 80;
    server_name rpsbrawl.ravitastudio.com;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    # 앞단 Caddy가 Via 헤더를 붙이므로, 이 줄이 없으면 압축하지 않는다.
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 파일 이름에 해시가 들어 있어 내용이 바뀌면 주소도 바뀐다.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# API와 WebSocket
server {
    listen 80;
    server_name rpsbrawl-api.ravitastudio.com;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 16k;

    # 로그인 토큰이 주소에 들어가므로 접속 기록을 남기지 않는다.
    access_log off;

    location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ {
        return 404;
    }

    location / {
        # main.py의 CORS 설정은 localhost만 허용하므로 여기서 실제 주소를 허용한다.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://rpsbrawl.ravitastudio.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin "https://rpsbrawl.ravitastudio.com" always;
        add_header Vary Origin always;

        set $upstream_api rpsbrawl-api;
        proxy_pass http://$upstream_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 앞단 nginx가 Cloudflare의 클라이언트 IP 하나만 넣어 준다(토큰이 이 값에 묶인다).
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
