# 가위바위보 난투 (https://rpsbrawl.ravitastudio.com). 서울 전용 서버.
# 시작: cd ~/rpsbrawl && docker compose up -d   중지: docker compose down (DB 볼륨은 남는다)
name: rpsbrawl

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rpsbrawl-api:
    build: ./api
    image: rpsbrawl-api
    container_name: rpsbrawl-api
    logging: *default-logging
    environment:
      RPS_SECRET: ${RPS_SECRET:?.env에 RPS_SECRET이 필요합니다}
    volumes:
      - rpsbrawl-data:/data
    networks:
      - internal
    mem_limit: 400m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  rpsbrawl-web:
    image: nginx:1.30.6-alpine
    container_name: rpsbrawl-web
    logging: *default-logging
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
    networks:
      - internal
      - edge
    mem_limit: 64m
    restart: unless-stopped

  # TLS를 끝내는 앞단. API 인증서는 Let's Encrypt에서 자동으로 받고 갱신한다.
  rpsbrawl-caddy:
    image: caddy:2.11.9-alpine
    container_name: rpsbrawl-caddy
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
    networks:
      - edge
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      - rpsbrawl-web
    restart: unless-stopped

networks:
  # API는 이 네트워크에만 있어 외부로 나갈 수 없다.
  internal:
    internal: true
  edge:

volumes:
  rpsbrawl-data:
  caddy-data:
